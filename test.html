<!DOCTYPE html>
<html>
<head>
    <title>Test API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
</head>
<body>
    <h2>Machine Add Test</h2>
    <button onclick="testAPI()">Call API</button>
    <pre id="output" style="background:#f0f0f0;padding:10px;margin-top:20px;"></pre>

    <hr>
    <h3>Add Machine</h3>
    <input type="text" id="machineName" placeholder="Machine Name">
    <button onclick="addMachine()">Add Machine</button>
    <pre id="addResult" style="background:#f0f0f0;padding:10px;margin-top:20px;"></pre>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyM6lIndiE3AMIRjD_RBMmr8qq85KLJ-IAIw1ZHhc4l5f3dDsV8tb25LBxOvQqBRa4e/exec";

        async function testAPI() {
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=getMachines`);
                const data = await res.json();
                document.getElementById('output').innerText = JSON.stringify(data, null, 2);
            } catch(err) {
                document.getElementById('output').innerText = "Error: " + err.message;
            }
        }

        async function addMachine() {
            const name = document.getElementById('machineName').value.trim();
            if(!name) {
                document.getElementById('addResult').innerText = "Please enter machine name";
                return;
            }
            try {
                const res = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'addMachine', name: name, location: 'Mobile' })
                });
                const data = await res.json();
                document.getElementById('addResult').innerText = JSON.stringify(data, null, 2);
                if(data.status === 'ok') {
                    document.getElementById('addResult').innerText = "✅ Machine added successfully!";
                } else {
                    document.getElementById('addResult').innerText = "❌ Failed: " + JSON.stringify(data);
                }
            } catch(err) {
                document.getElementById('addResult').innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
